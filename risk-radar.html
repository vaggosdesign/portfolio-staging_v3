<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Risk Radar — Vaggos Angelis</title><script>window.location.replace('index.html#risk-radar');</script></head><body><p><a href="index.html#risk-radar">Open Risk Radar case study</a></p>
<div class="case-lightbox" id="case-lightbox" aria-hidden="true">
  <div class="case-lightbox-dialog" role="dialog" aria-modal="true" aria-label="Image preview">
    <button class="case-lightbox-close" type="button" aria-label="Close image preview">×</button>
    <img class="case-lightbox-image" alt="" src=""/>
  </div>
</div>

<script>
(function () {
  const lightbox = document.getElementById('case-lightbox');
  if (!lightbox) return;
  const lightboxImg = lightbox.querySelector('.case-lightbox-image');
  const closeBtn = lightbox.querySelector('.case-lightbox-close');

  function openLightbox(src, alt) {
    lightboxImg.src = src;
    lightboxImg.alt = alt || '';
    lightbox.classList.add('is-open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    closeBtn.focus();
  }

  function closeLightbox() {
    lightbox.classList.remove('is-open');
    lightbox.setAttribute('aria-hidden', 'true');
    lightboxImg.src = '';
    lightboxImg.alt = '';
    document.body.style.overflow = '';
  }

  document.querySelectorAll('.case-image-link[data-lightbox-src]').forEach((link) => {
    link.addEventListener('click', (event) => {
      event.preventDefault();
      openLightbox(link.getAttribute('data-lightbox-src'), link.getAttribute('data-lightbox-alt'));
    });
  });

  closeBtn.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (event) => {
    if (event.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && lightbox.classList.contains('is-open')) closeLightbox();
  });
})();
</script>

</body></html>
